name: QA temporário sync-v9 hotfix2 Safari-PWA

on:
  push:
    branches: [agent/sync-v9-hotfix2-wake-pull]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sintaxe e integridade C2
        run: |
          set -euo pipefail
          node --check ios-safari-pwa-catchup.js
          node --check beta-banner.js
          node --check firebase-ios-transport.js
          node --check ios-cloud-shell.js
          grep -Fq 'ios-safari-pwa-catchup.js?v=1' beta-banner.js
          grep -Fq 'hotfix: "safari-pwa-catchup-2"' ios-safari-pwa-catchup.js
          node scripts/validate-wallet-data.mjs

      - name: Simular retomada Safari para PWA e recuperação de erro
        run: |
          cat > /tmp/test-catchup.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';

          class MemoryStorage {
            constructor() { this.map = new Map(); }
            getItem(k) { return this.map.has(k) ? this.map.get(k) : null; }
            setItem(k, v) { this.map.set(k, String(v)); }
            removeItem(k) { this.map.delete(k); }
          }
          class CE extends Event {
            constructor(type, options = {}) { super(type, options); this.detail = options.detail; }
          }

          globalThis.CustomEvent = CE;
          globalThis.localStorage = new MemoryStorage();
          globalThis.window = new EventTarget();
          globalThis.document = new EventTarget();
          Object.defineProperty(globalThis.document, 'visibilityState', { value: 'visible', writable: true });
          Object.defineProperty(globalThis, 'navigator', { value: { onLine: true }, configurable: true });
          globalThis.SULotoFirestoreTransport = { ios: true, restOnly: true };
          globalThis.SULotoSyncEvents = { EVENT_NAME: 'su:state-change' };

          let pulls = 0;
          let pending = {};
          let applied = 'pendente';
          let initialized = false;
          const states = [];
          window.addEventListener('su:loto-rest-sync-state', event => states.push(event.detail));

          const moduleUrl = pathToFileURL(process.cwd() + '/ios-safari-pwa-catchup.js').href + '?qa=' + Date.now();
          await import(moduleUrl);

          setTimeout(() => {
            globalThis.SULotoIOSRestOperationalSync = {
              active: true,
              pullStatuses: async () => {
                pulls += 1;
                if (pulls >= 3) applied = 'apostado';
                return { count: 300 };
              },
              pullContests: async () => ({ merged: Array(9).fill({}) }),
              pullContestBets: async () => ({ merged: {} }),
              pendingStatuses: () => ({ ...pending }),
              diagnostics: () => ({ ready: { statuses: true, contests: true, contestBets: true }, lastError: null })
            };
          }, 100);

          for (let i = 0; i < 80; i += 1) {
            await new Promise(r => setTimeout(r, 50));
            if (globalThis.SULotoIOSSafariPWACatchup?.diagnostics?.().initialized) { initialized = true; break; }
          }
          assert.equal(initialized, true, 'coordenador deve aguardar e detectar a engine REST');

          await new Promise(r => setTimeout(r, 3000));
          assert.ok(pulls >= 3, `esperadas leituras repetidas na retomada; obtidas ${pulls}`);
          assert.equal(applied, 'apostado', 'a leitura posterior deve capturar a alteração feita no outro contexto');
          assert.ok(states.some(row => row.kind === 'synced'), 'deve terminar sincronizado');

          let leakedOldError = 0;
          window.addEventListener('su:loto-rest-sync-state', event => {
            if (event.detail?.source !== 'ios-safari-pwa-catchup' && event.detail?.kind === 'error') leakedOldError += 1;
          });
          pending = { '051': 'apostado' };
          window.addEventListener('su:state-change', () => { setTimeout(() => { pending = {}; }, 120); }, { once: true });

          window.dispatchEvent(new CustomEvent('su:loto-rest-sync-state', {
            detail: { kind: 'error', text: 'Falha na sincronização', source: 'engine-antiga' }
          }));
          await new Promise(r => setTimeout(r, 3200));

          assert.equal(leakedOldError, 0, 'erro genérico recuperável não deve vazar para o painel antes do catch-up');
          assert.deepEqual(pending, {}, 'alteração pendente deve ser reencaminhada e confirmada');
          assert.equal(states.at(-1)?.kind, 'synced', 'estado final deve ser sincronizado após recuperação');
          console.log(JSON.stringify({ pulls, applied, finalState: states.at(-1)?.kind, pendingCount: Object.keys(pending).length }));
          NODE
          node /tmp/test-catchup.mjs

      - name: Escopo protegido
        run: |
          set -euo pipefail
          git fetch origin beta
          changed="$(git diff --name-only origin/beta...HEAD)"
          echo "$changed"
          ! echo "$changed" | grep -E '^data/carteira-c2/'
          ! echo "$changed" | grep -E '^VERSION$|^app\.js$|^contests\.js$|^official-results\.js$'
