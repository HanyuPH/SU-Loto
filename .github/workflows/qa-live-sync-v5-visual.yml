name: QA live e visual SU Loto v23 sync-v5

on:
  pull_request:
    branches: [beta]
  push:
    branches: [audit/live-v23-sync-v5-visual]

permissions:
  contents: read

jobs:
  qa-live-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar auditoria
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar Carteira C2 antes da bateria
        run: |
          node scripts/validate-wallet-data.mjs
          git fetch origin beta
          changed="$(git diff --name-only origin/beta...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^data/carteira-c2/|^data/migrations/|^VERSION$'; then
            echo 'A auditoria temporária não pode alterar C2, migrações ou VERSION.' >&2
            exit 1
          fi

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Isolar autenticação no ambiente de QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/live-post-sync-v5-visual.mjs')
          text = path.read_text()
          old = '''  await page.evaluate(() => {
              const gate = document.getElementById("su-loto-cloud-gate");
              if (gate) gate.hidden = true;
            });'''
          new = '''  await page.evaluate(() => {
              let style = document.getElementById("qa-hide-cloud-gate");
              if (!style) {
                style = document.createElement("style");
                style.id = "qa-hide-cloud-gate";
                style.textContent = "#su-loto-cloud-gate{display:none!important;pointer-events:none!important}";
                document.head.appendChild(style);
              }
              const gate = document.getElementById("su-loto-cloud-gate");
              if (gate) gate.hidden = true;
            });'''
          if old not in text:
              raise SystemExit('Trecho esperado de hideAuthGate não encontrado')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Executar bateria pública e visual
        run: node tests/live-post-sync-v5-visual.mjs

      - name: Publicar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: su-loto-v23-sync-v5-live-visual
          path: artifacts/live-visual-sync-v5/
          if-no-files-found: warn
          retention-days: 7
