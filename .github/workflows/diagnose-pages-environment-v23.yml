name: Diagnosticar política do GitHub Pages SU Loto

on:
  pull_request:
    branches: [beta]
    paths:
      - "docs/TRIGGER-PAGES-DIAG-v23.txt"

permissions:
  contents: read
  actions: read
  checks: read
  deployments: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIX_COMMIT: 1359bf5b70bc84ae93c7f8228e898c697c5c141f
      LOTO_BASE: https://hanyuph.github.io/SU-Loto
      MEGA_BASE: https://hanyuph.github.io/SU-Mega
    steps:
      - name: Diagnosticar encadeamento final sem alterar estado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p /tmp/pages-diag
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=50" > /tmp/pages-diag/main-runs.json || true
          jq --arg sha "$FIX_COMMIT" '[.workflow_runs[] | select(.head_sha == $sha) | {id,name,event,status,conclusion,head_branch,head_sha,created_at,updated_at,html_url}]' /tmp/pages-diag/main-runs.json > /tmp/pages-diag/fix-runs.json 2>/dev/null || echo '[]' > /tmp/pages-diag/fix-runs.json
          echo '=== TODOS OS RUNS DO COMMIT DA MAIN ==='
          cat /tmp/pages-diag/fix-runs.json

          run_id=$(jq -r '[.[] | select(.name == "Publicar SU Loto estável e Beta")][0].id // empty' /tmp/pages-diag/fix-runs.json)
          echo "latest_pages_run=$run_id"
          if test -n "$run_id"; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/pages-diag/latest-pages-run.json || true
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/pages-diag/latest-pages-jobs.json || true
            echo '=== LATEST PAGES RUN ==='
            jq '{id,name,event,status,conclusion,head_branch,head_sha,created_at,updated_at,html_url}' /tmp/pages-diag/latest-pages-run.json 2>/dev/null || cat /tmp/pages-diag/latest-pages-run.json
            echo '=== LATEST PAGES JOBS ==='
            jq '[.jobs[] | {id,name,status,conclusion,started_at,completed_at,html_url}]' /tmp/pages-diag/latest-pages-jobs.json 2>/dev/null || cat /tmp/pages-diag/latest-pages-jobs.json
          fi

          gh api "/repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=50" > /tmp/pages-diag/deployments.json || true
          jq --arg sha "$FIX_COMMIT" '[.[] | select(.sha == $sha) | {id,ref,sha,created_at,updated_at,statuses_url}]' /tmp/pages-diag/deployments.json > /tmp/pages-diag/fix-deployments.json 2>/dev/null || echo '[]' > /tmp/pages-diag/fix-deployments.json
          echo '=== DEPLOYMENTS DO COMMIT ==='
          cat /tmp/pages-diag/fix-deployments.json

          latest_deployment=$(jq -r '.[0].id // empty' /tmp/pages-diag/fix-deployments.json)
          if test -n "$latest_deployment"; then
            gh api "/repos/$GITHUB_REPOSITORY/deployments/$latest_deployment/statuses" > /tmp/pages-diag/latest-deployment-statuses.json || true
            echo '=== STATUS DO DEPLOYMENT MAIS RECENTE ==='
            jq '[.[] | {id,state,environment,environment_url,created_at,updated_at,log_url}]' /tmp/pages-diag/latest-deployment-statuses.json 2>/dev/null || cat /tmp/pages-diag/latest-deployment-statuses.json
          fi

          audit="diag-${GITHUB_RUN_ID}"
          for spec in \
            "$LOTO_BASE/beta/beta-banner.js|const BUILD = \"v23\"|loto-banner" \
            "$LOTO_BASE/beta/VERSION|latestBetaDocumented=v23|loto-version" \
            "$LOTO_BASE/beta/bootstrap.js|beta-banner.js?v=23|loto-bootstrap" \
            "$LOTO_BASE/beta/service-worker.js|su-loto-c2-v23-sync-v2|loto-sw" \
            "$MEGA_BASE/beta/beta-banner.js|const BUILD = \"v29\"|mega-banner" \
            "$MEGA_BASE/beta/service-worker.js|su-mega-c2-beta-v29|mega-sw"; do
            IFS='|' read -r url pattern label <<< "$spec"
            if curl -fsSL -H 'Cache-Control: no-cache' "$url?audit=$audit" -o "/tmp/pages-diag/$label.txt" && grep -Fq "$pattern" "/tmp/pages-diag/$label.txt"; then
              echo "$label=OK" | tee -a /tmp/pages-diag/live-status.txt
            else
              echo "$label=FAIL" | tee -a /tmp/pages-diag/live-status.txt
            fi
          done

      - name: Preservar diagnóstico final
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-encadeamento-pages-su-loto-v23
          path: /tmp/pages-diag
          if-no-files-found: error
