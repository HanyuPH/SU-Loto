name: Validar sincronização local-first SU Loto v23

on:
  push:
    branches:
      - agent/su-loto-v23-sync-local-first-fix
  pull_request:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: qa-v23-sync-local-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-local-first:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Baixar correção Beta v23
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar escopo e Carteira C2
        run: |
          node scripts/validate-wallet-data.mjs
          git fetch origin beta
          changed="$(git diff --name-only origin/beta...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^data/carteira-c2/|^data/migrations/|^VERSION$'; then
            echo 'Falha: a correção de sincronização não pode alterar a Carteira C2, migrações ou VERSION.' >&2
            exit 1
          fi

      - name: Validar integração local-first
        run: |
          node --check bootstrap.js
          node --check sync-local-first-guard.js
          node --check service-worker.js
          node --check tests/sync-local-first-smoke.mjs
          grep -q 'sync-local-first-guard.js?v=1' bootstrap.js
          grep -q 'cloud-sync.js?v=2' bootstrap.js
          grep -q '"./sync-local-first-guard.js"' service-worker.js
          grep -q 'su-loto-c2-v23-sync-v3' service-worker.js
          grep -q 'stopImmediatePropagation' sync-local-first-guard.js
          grep -q 'Salvando na nuvem…' sync-local-first-guard.js

      - name: Instalar navegadores de QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Iniciar Beta localmente
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/su-loto-sync-server.log 2>&1 &
          echo $! > /tmp/su-loto-sync-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/su-loto-sync-server.log
          exit 1

      - name: Testar sincronização local-first em Chromium
        env:
          QA_BASE_URL: http://127.0.0.1:4173/
          QA_BROWSER: chromium
        run: timeout 90s node tests/sync-local-first-smoke.mjs

      - name: Testar sincronização local-first em WebKit
        env:
          QA_BASE_URL: http://127.0.0.1:4173/
          QA_BROWSER: webkit
        run: timeout 90s node tests/sync-local-first-smoke.mjs

      - name: Encerrar servidor
        if: always()
        run: |
          if [ -f /tmp/su-loto-sync-server.pid ]; then
            kill "$(cat /tmp/su-loto-sync-server.pid)" 2>/dev/null || true
          fi
