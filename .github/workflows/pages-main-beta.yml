name: Publicar SU Loto estável e Beta

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar versão estável
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Baixar versão Beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source

      - name: Montar e validar site publicado
        run: |
          mkdir -p public/beta
          rsync -a --exclude='.git' --exclude='.github' stable/ public/
          rsync -a --exclude='.git' --exclude='.github' beta-source/ public/beta/
          touch public/.nojekyll
          touch public/beta/.nojekyll

          # Versão estável SU Loto v11
          test -f public/index.html
          test -f public/app.js
          test -f public/contest-bets.js
          test -f public/contest-bets-cloud.js
          test -f public/contest-lock.js
          test -f public/contest-session.js
          grep -q 'stable-su-loto-c2-v11' public/service-worker.js
          grep -q 'event.key===STORAGE_KEY' public/app.js
          grep -q 'Marcações sincronizadas' public/app.js
          grep -q 'Resultado publicado • bloqueado' public/contest-lock.js
          grep -q 'Reabrir concurso' public/contest-session.js
          ! grep -q "beta-banner.js" public/service-worker.js
          node --check public/app.js
          node --check public/contest-bets.js
          node --check public/contest-bets-cloud.js
          node --check public/contest-lock.js
          node --check public/contest-session.js
          node --check public/service-worker.js

          # Ambiente Beta SU Loto v18
          test -f public/beta/index.html
          test -f public/beta/app.js
          test -f public/beta/official-results.js
          test -f public/beta/realtime-cloud.js
          test -f public/beta/contest-bets.js
          test -f public/beta/contest-bets-cloud.js
          test -f public/beta/contest-lock.js
          test -f public/beta/contest-session.js
          test -f public/beta/contest-selection-ui.js
          grep -q 'const BUILD = "v18"' public/beta/beta-banner.js
          grep -q 'su-loto-c2-beta-v18' public/beta/service-worker.js
          grep -q "realtime-cloud.js?v=2" public/beta/service-worker.js
          grep -q "contest-session.js?v=2" public/beta/service-worker.js
          grep -q "contest-selection-ui.js?v=1" public/beta/service-worker.js
          ! grep -q "cloud-sync.js" public/beta/service-worker.js
          grep -q 'persistentLocalCache' public/beta/realtime-cloud.js
          grep -q 'persistentMultipleTabManager' public/beta/realtime-cloud.js
          grep -q 'pendingWrites' public/beta/realtime-cloud.js
          grep -q 'inFlightWrites' public/beta/realtime-cloud.js
          grep -q 'installLocalWriteCapture' public/beta/realtime-cloud.js
          grep -q 'applyingRemoteMirror' public/beta/realtime-cloud.js
          grep -q 'statusSnapshotReady' public/beta/realtime-cloud.js
          grep -q 'schema: 4' public/beta/realtime-cloud.js
          grep -q 'onSnapshot' public/beta/realtime-cloud.js
          grep -q 'MutationObserver' public/beta/realtime-cloud.js
          grep -q 'getDocsFromServer' public/beta/realtime-cloud.js
          grep -q 'Sincronizado em tempo real' public/beta/realtime-cloud.js
          grep -q 'Concurso selecionado' public/beta/contest-selection-ui.js
          grep -q 'contest-selected-badge' public/beta/contest-selection-ui.js
          grep -q 'aria-current' public/beta/contest-selection-ui.js
          grep -q 'contestSessionV2' public/beta/contest-session.js
          grep -q 'su:local-statuses-changed' public/beta/contest-session.js
          grep -q 'Outros concursos ativos serão preservados' public/beta/contest-session.js
          grep -q 'save: "su-save-contest-bets"' public/beta/contest-session.js
          grep -q 'reopen: "su-reopen-contest-bets"' public/beta/contest-session.js
          ! grep -q 'activeOther' public/beta/contest-session.js
          ! grep -q 'migrateLegacySessions' public/beta/contest-session.js
          grep -q 'Consulta direta à fonte oficial' public/beta/official-results.js
          grep -q 'ainda não publicado pela CAIXA' public/beta/official-results.js
          grep -q 'event.key===STORAGE_KEY' public/beta/app.js
          grep -q 'Marcações sincronizadas' public/beta/app.js
          grep -q 'Resultado publicado • bloqueado' public/beta/contest-lock.js
          grep -q 'Reabrir concurso' public/beta/contest-session.js
          node --check public/beta/app.js
          node --check public/beta/realtime-cloud.js
          node --check public/beta/contest-selection-ui.js
          node --check public/beta/official-results.js
          node --check public/beta/contest-bets.js
          node --check public/beta/contest-bets-cloud.js
          node --check public/beta/contest-lock.js
          node --check public/beta/contest-session.js
          node --check public/beta/service-worker.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
