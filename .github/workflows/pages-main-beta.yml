name: Publicar SU Loto estável e Beta

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-su-loto
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar versão estável
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Baixar versão Beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source

      - name: Montar e validar site
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public/beta
          rsync -a --exclude='.git/' --exclude='.github/' stable/ public/
          rsync -a --exclude='.git/' --exclude='.github/' beta-source/ public/beta/

          # Resultados oficiais são dados operacionais compartilhados. A main é
          # a origem do robô da CAIXA; a Beta deve receber exatamente os mesmos
          # arquivos a cada publicação, sem alterar a Carteira C2.
          install -m 0644 stable/data/ultimo-concurso.json public/beta/data/ultimo-concurso.json
          install -m 0644 stable/data/concursos-oficiais.json public/beta/data/concursos-oficiais.json
          install -m 0644 stable/data/concursos-oficiais.csv public/beta/data/concursos-oficiais.csv
          cmp stable/data/ultimo-concurso.json public/beta/data/ultimo-concurso.json
          cmp stable/data/concursos-oficiais.json public/beta/data/concursos-oficiais.json
          cmp stable/data/concursos-oficiais.csv public/beta/data/concursos-oficiais.csv
          touch public/.nojekyll public/beta/.nojekyll

          # Estável preservada em /
          test -f public/index.html
          test -f public/VERSION
          grep -q '^stableVersion=v11$' public/VERSION
          node --check public/app.js
          node --check public/service-worker.js

          # Beta v23 e Carteira C2
          for file in index.html bootstrap.js firebase-ios-transport.js sync-events.js app.js service-worker.js official-results.js contest-bets.js VERSION; do
            test -f "public/beta/$file"
          done
          test -f public/beta/data/carteira-c2/manifest.json
          test -f public/beta/data/carteira-c2/games-001-050.json
          test -f public/beta/data/carteira-c2/games-251-300.json
          grep -q '^latestBetaDocumented=v23$' public/beta/VERSION
          grep -q '^walletGames=300$' public/beta/VERSION
          grep -q 'src="bootstrap.js"' public/beta/index.html

          BETA_SYNC_BUILD="$(sed -nE 's/^const SERVICE_WORKER_BUILD = "(sync-v[0-9]+)";$/\1/p' public/beta/bootstrap.js | head -1)"
          test -n "$BETA_SYNC_BUILD"
          echo "Build de sincronização Beta detectado: $BETA_SYNC_BUILD"
          grep -Fq "su-loto-c2-v23-${BETA_SYNC_BUILD}" public/beta/service-worker.js

          case "$BETA_SYNC_BUILD" in
            sync-v8)
              for file in ios-rest-status-refresh.js ios-pwa-sync-coordinator.js cloud-sync.js contest-bets-cloud.js; do test -f "public/beta/$file"; done
              grep -Fq 'firebase-ios-transport.js?v=1' public/beta/bootstrap.js
              grep -Fq 'ios-rest-status-refresh.js?v=1' public/beta/bootstrap.js
              grep -Fq 'cloud-sync.js?v=3' public/beta/bootstrap.js
              grep -Fq 'ios-pwa-sync-coordinator.js?v=1' public/beta/bootstrap.js
              grep -Fq 'ios-rest-status-refresh.js' public/beta/service-worker.js
              grep -Fq 'ios-pwa-sync-coordinator.js' public/beta/service-worker.js
              grep -Fq 'protocol: "sync-v8"' public/beta/ios-pwa-sync-coordinator.js
              grep -Fq 'experimentalForceLongPolling: true' public/beta/firebase-ios-transport.js
              grep -Fq 'memoryLocalCache' public/beta/firebase-ios-transport.js
              node --check public/beta/ios-rest-status-refresh.js
              node --check public/beta/ios-pwa-sync-coordinator.js
              ;;
            sync-v9)
              for file in ios-rest-operational-sync.js ios-cloud-shell.js official-results-live-refresh.js; do test -f "public/beta/$file"; done
              grep -Fq 'firebase-ios-transport.js?v=2' public/beta/bootstrap.js
              grep -Fq 'ios-rest-operational-sync.js?v=1' public/beta/bootstrap.js
              grep -Fq 'ios-cloud-shell.js?v=1' public/beta/bootstrap.js
              grep -Fq 'official-results-live-refresh.js?v=1' public/beta/bootstrap.js
              grep -Fq 'restOnly: ios' public/beta/firebase-ios-transport.js
              grep -Fq 'protocol: ios ? "sync-v9" : "sdk"' public/beta/firebase-ios-transport.js
              grep -Fq 'protocol: "sync-v9"' public/beta/ios-rest-operational-sync.js
              grep -Fq 'firestore.googleapis.com/v1/projects' public/beta/ios-rest-operational-sync.js
              grep -Fq 'suLotoContestBetsC2' public/beta/ios-rest-operational-sync.js
              grep -Fq 'servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil' public/beta/official-results-live-refresh.js
              grep -Fq 'ios-rest-operational-sync.js' public/beta/service-worker.js
              grep -Fq 'ios-cloud-shell.js' public/beta/service-worker.js
              node --check public/beta/ios-rest-operational-sync.js
              node --check public/beta/ios-cloud-shell.js
              node --check public/beta/official-results-live-refresh.js
              ;;
            *)
              echo "FALHA: build de sincronização Beta não reconhecido: $BETA_SYNC_BUILD" >&2
              exit 1
              ;;
          esac

          grep -Fq 'su:state-change' public/beta/sync-events.js
          ! grep -q 'response.text(' public/beta/service-worker.js
          ! grep -q 'new Response(' public/beta/service-worker.js
          for legacy in data/games-1.js data/games-2.js data/games-3.js data/games-4.js data/games-5.js data/games-6.js; do
            test ! -e "public/beta/$legacy"
          done
          for file in bootstrap.js firebase-ios-transport.js sync-events.js app.js service-worker.js official-results.js contest-bets.js; do
            node --check "public/beta/$file"
          done
          (cd public/beta && node scripts/validate-wallet-data.mjs)

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verificar publicação real do Ecossistema SU
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      LOTO_BASE: https://hanyuph.github.io/SU-Loto
      MEGA_BASE: https://hanyuph.github.io/SU-Mega
    steps:
      - name: Conferir SU Loto e SU Mega no Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          audit="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_until() {
            local url="$1" pattern="$2" output="$3" attempt
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "${url}?audit=${audit}-${attempt}" -o "$output" \
                && grep -Fq "$pattern" "$output"; then
                echo "OK: $url contém $pattern"
                return 0
              fi
              sleep 5
            done
            echo "FALHA: $url não apresentou $pattern após as tentativas." >&2
            test -f "$output" && head -c 1200 "$output" >&2 || true
            return 1
          }

          fetch_until "$LOTO_BASE/beta/beta-banner.js" 'const BUILD = "v23"' /tmp/loto-banner.js
          fetch_until "$LOTO_BASE/beta/VERSION" 'latestBetaDocumented=v23' /tmp/loto-version.txt
          fetch_until "$LOTO_BASE/beta/bootstrap.js" 'const SERVICE_WORKER_BUILD = "sync-v' /tmp/loto-bootstrap.js
          BETA_SYNC_BUILD="$(sed -nE 's/^const SERVICE_WORKER_BUILD = "(sync-v[0-9]+)";$/\1/p' /tmp/loto-bootstrap.js | head -1)"
          [[ "$BETA_SYNC_BUILD" =~ ^sync-v[0-9]+$ ]]
          echo "Build publicado: $BETA_SYNC_BUILD"
          fetch_until "$LOTO_BASE/beta/service-worker.js" "su-loto-c2-v23-${BETA_SYNC_BUILD}" /tmp/loto-sw.js

          if [[ "$BETA_SYNC_BUILD" == "sync-v8" ]]; then
            fetch_until "$LOTO_BASE/beta/bootstrap.js" 'ios-pwa-sync-coordinator.js?v=1' /tmp/loto-bootstrap.js
            fetch_until "$LOTO_BASE/beta/ios-pwa-sync-coordinator.js" 'protocol: "sync-v8"' /tmp/loto-ios.js
          elif [[ "$BETA_SYNC_BUILD" == "sync-v9" ]]; then
            fetch_until "$LOTO_BASE/beta/bootstrap.js" 'ios-rest-operational-sync.js?v=1' /tmp/loto-bootstrap.js
            fetch_until "$LOTO_BASE/beta/bootstrap.js" 'ios-cloud-shell.js?v=1' /tmp/loto-bootstrap.js
            fetch_until "$LOTO_BASE/beta/ios-rest-operational-sync.js" 'protocol: "sync-v9"' /tmp/loto-ios-rest.js
            fetch_until "$LOTO_BASE/beta/ios-rest-operational-sync.js" 'suLotoContestBetsC2' /tmp/loto-ios-rest.js
            fetch_until "$LOTO_BASE/beta/official-results-live-refresh.js" 'servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil' /tmp/loto-results.js
          else
            echo "Build não reconhecido: $BETA_SYNC_BUILD" >&2
            exit 1
          fi

          fetch_until "$LOTO_BASE/data/ultimo-concurso.json" '"number"' /tmp/loto-result-stable.json
          fetch_until "$LOTO_BASE/beta/data/ultimo-concurso.json" '"number"' /tmp/loto-result-beta.json
          cmp /tmp/loto-result-stable.json /tmp/loto-result-beta.json
          fetch_until "$LOTO_BASE/service-worker.js" 'stable-su-loto-c2-v11' /tmp/loto-stable-sw.js
          fetch_until "$MEGA_BASE/beta/beta-banner.js" 'const BUILD = "v29"' /tmp/mega-banner.js
          fetch_until "$MEGA_BASE/beta/service-worker.js" 'su-mega-c2-beta-v29' /tmp/mega-sw.js

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='pages-live-audit' \
            -f description="SU Loto Beta v23 ${BETA_SYNC_BUILD}, resultados e SU Mega v29 confirmados no Pages"
