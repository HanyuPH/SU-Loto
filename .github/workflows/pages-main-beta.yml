name: Publicar SU Loto estável e Beta

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar versão estável
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Baixar versão Beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source

      - name: Montar site publicado
        run: |
          mkdir -p public/beta
          rsync -a --exclude='.git' --exclude='.github' stable/ public/
          rsync -a --exclude='.git' --exclude='.github' beta-source/ public/beta/
          touch public/.nojekyll
          touch public/beta/.nojekyll
          test -f public/index.html
          test -f public/beta/index.html
          test -f public/beta/contest-bets.js
          test -f public/beta/contest-bets-cloud.js
          test -f public/beta/contest-lock.js
          test -f public/beta/contest-session.js
          grep -q 'const BUILD = "v10"' public/beta/beta-banner.js
          grep -q 'su-loto-c2-beta-v10' public/beta/service-worker.js
          grep -q 'contest-layout>.contest-form-card{order:1!important}' public/beta/beta-layout-review.js
          grep -q 'contest-layout>.contest-tools-card{order:2!important}' public/beta/beta-layout-review.js
          grep -q 'Tipo do concurso' public/beta/contest-bets.js
          grep -q 'Concluir concurso' public/beta/contest-bets.js
          grep -q 'status: row?.status === "concluido"' public/beta/contest-bets-cloud.js
          grep -q 'Resultado publicado • bloqueado' public/beta/contest-lock.js
          grep -q 'Reabrir concurso' public/beta/contest-session.js
          grep -q "contest-lock.js?v=1" public/beta/service-worker.js
          grep -q "contest-session.js?v=1" public/beta/service-worker.js
          node --check public/beta/contest-lock.js
          node --check public/beta/contest-session.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
