name: Publicar SU Loto estável e Beta

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar versão estável
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Baixar versão Beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source

      - name: Montar e validar site publicado
        run: |
          mkdir -p public/beta
          rsync -a --exclude='.git' --exclude='.github' stable/ public/
          rsync -a --exclude='.git' --exclude='.github' beta-source/ public/beta/
          touch public/.nojekyll
          touch public/beta/.nojekyll
          test -f public/index.html
          test -f public/beta/index.html
          test -f public/beta/app.js
          test -f public/beta/official-results.js
          test -f public/beta/realtime-cloud.js
          test -f public/beta/contest-bets.js
          test -f public/beta/contest-bets-cloud.js
          test -f public/beta/contest-lock.js
          test -f public/beta/contest-session.js
          grep -q 'const BUILD = "v15"' public/beta/beta-banner.js
          grep -q 'su-loto-c2-beta-v15' public/beta/service-worker.js
          grep -q "realtime-cloud.js?v=1" public/beta/service-worker.js
          ! grep -q "cloud-sync.js" public/beta/service-worker.js
          grep -q 'persistentLocalCache' public/beta/realtime-cloud.js
          grep -q 'persistentMultipleTabManager' public/beta/realtime-cloud.js
          grep -q 'onSnapshot' public/beta/realtime-cloud.js
          grep -q 'MutationObserver' public/beta/realtime-cloud.js
          grep -q 'getDocsFromServer' public/beta/realtime-cloud.js
          grep -q 'Sincronizado em tempo real' public/beta/realtime-cloud.js
          grep -q 'Consulta direta à fonte oficial' public/beta/official-results.js
          grep -q 'ainda não publicado pela CAIXA' public/beta/official-results.js
          grep -q 'event.key===STORAGE_KEY' public/beta/app.js
          grep -q 'Marcações sincronizadas' public/beta/app.js
          grep -q 'Tipo do concurso' public/beta/contest-bets.js
          grep -q 'Resultado publicado • bloqueado' public/beta/contest-lock.js
          grep -q 'Reabrir concurso' public/beta/contest-session.js
          node --check public/beta/app.js
          node --check public/beta/realtime-cloud.js
          node --check public/beta/official-results.js
          node --check public/beta/contest-bets.js
          node --check public/beta/contest-bets-cloud.js
          node --check public/beta/contest-lock.js
          node --check public/beta/contest-session.js
          node --check public/beta/service-worker.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
