name: QA temporário SU Loto sync-v9

on:
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validar sintaxe e C2
        run: |
          node --check bootstrap.js
          node --check firebase-ios-transport.js
          node --check ios-rest-operational-sync.js
          node --check ios-cloud-shell.js
          node --check official-results-live-refresh.js
          node --check service-worker.js
          node tests/sync-v9-static.mjs
          node scripts/validate-wallet-data.mjs
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit
      - name: Bateria Chromium e WebKit
        run: node tests/sync-v9-browser.mjs
      - name: Conferir escopo protegido
        run: |
          git fetch origin beta
          files="$(git diff --name-only origin/beta...HEAD)"
          echo "$files"
          ! echo "$files" | grep -E '^data/carteira-c2/'
          ! echo "$files" | grep -E '^VERSION$'
          ! echo "$files" | grep -E '^app\.js$'
          ! echo "$files" | grep -E '^contests\.js$'
