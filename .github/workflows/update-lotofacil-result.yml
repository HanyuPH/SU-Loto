name: Atualizar resultado oficial da Lotofácil

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-lotofacil-result.yml"
      - "scripts/update-lotofacil-result.mjs"
  schedule:
    # Verificação horária: reduz dependência de uma janela noturna específica
    # e garante recuperação automática caso o agendador ou a CAIXA atrasem.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      contest_number:
        description: "Concurso específico para adicionar ao histórico (opcional)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: atualizar-resultado-lotofacil
  cancel-in-progress: false

jobs:
  update-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Consultar e validar resultado oficial
        env:
          CONTEST_NUMBER: ${{ inputs.contest_number }}
        run: node scripts/update-lotofacil-result.mjs

      - name: Publicar somente quando houver alteração
        id: publish
        run: |
          if git diff --quiet -- data/ultimo-concurso.json data/concursos-oficiais.json data/concursos-oficiais.csv; then
            echo "Nenhum resultado novo ou corrigido."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/ultimo-concurso.json data/concursos-oficiais.json data/concursos-oficiais.csv
          git commit -m "Atualizar resultado oficial da Lotofácil"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Republicar GitHub Pages após resultado novo
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/pages-main-beta.yml/dispatches" \
            -f ref=main
          echo "Publicação do Pages solicitada após atualização do resultado oficial."
