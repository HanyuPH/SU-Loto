name: QA PWA sync-v8

on:
  pull_request:
    branches: [beta]
    paths:
      - 'bootstrap.js'
      - 'service-worker.js'
      - 'ios-pwa-sync-coordinator.js'
      - 'tests/ios-pwa-sync-v8-webkit.mjs'
      - 'tests/service-worker-sync-v8-webkit.mjs'
      - '.github/workflows/qa-pwa-sync-v8.yml'

permissions:
  contents: read

jobs:
  qa-pwa-sync-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar C2, sintaxe e atualização PWA
        run: |
          set -euo pipefail
          node scripts/validate-wallet-data.mjs
          node --check bootstrap.js
          node --check service-worker.js
          node --check ios-rest-status-refresh.js
          node --check ios-pwa-sync-coordinator.js
          grep -q 'SERVICE_WORKER_BUILD = "sync-v8"' bootstrap.js
          grep -q 'updateViaCache: "none"' bootstrap.js
          grep -q 'registration.update()' bootstrap.js
          grep -q 'ios-pwa-sync-coordinator.js?v=1' bootstrap.js
          grep -q 'su-loto-c2-v23-sync-v8' service-worker.js
          grep -q 'SKIP_WAITING' service-worker.js
          grep -q 'ios-pwa-sync-coordinator.js' service-worker.js
          grep -q 'manual-preflight' ios-pwa-sync-coordinator.js
          grep -q 'pwa-fallback-' ios-pwa-sync-coordinator.js

      - name: Instalar WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Executar bateria WebKit iPhone/PWA
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/su-loto-sync-v8-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/ios-rest-fastpath-harness.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/ios-rest-fastpath-webkit.mjs
          node tests/ios-pwa-sync-v8-webkit.mjs
          node tests/service-worker-sync-v8-webkit.mjs

      - name: Confirmar escopo protegido
        run: |
          set -euo pipefail
          git fetch origin beta
          changed="$(git diff --name-only origin/beta...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/qa-pwa-sync-v8.yml|bootstrap.js|service-worker.js|ios-pwa-sync-coordinator.js|tests/ios-pwa-sync-v8-webkit.mjs|tests/service-worker-sync-v8-webkit.mjs)$' || true)"
          if test -n "$unexpected"; then
            echo 'QA falhou: arquivos fora do escopo protegido:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          ! printf '%s\n' "$changed" | grep -E '^data/carteira-c2/'
          ! printf '%s\n' "$changed" | grep -E '^(VERSION|app.js|contests.js|cloud-sync.js|ios-rest-status-refresh.js|cloud-resume-refresh.js)$'
