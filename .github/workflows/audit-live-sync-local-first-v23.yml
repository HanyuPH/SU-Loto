name: Auditar sincronização local-first publicada SU Loto v23

on:
  pull_request:
    branches:
      - beta

permissions:
  contents: read
  actions: read

concurrency:
  group: audit-live-sync-local-first-v23
  cancel-in-progress: true

jobs:
  audit-live:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identificar workflow oficial e confirmar correção live
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.name == "Publicar SU Loto estável e Beta") | {id,name,path,state}'
          curl -fsSL -H 'Cache-Control: no-cache' \
            "https://hanyuph.github.io/SU-Loto/beta/service-worker.js?audit=${GITHUB_RUN_ID}" \
            | grep -F 'su-loto-c2-v23-sync-v3'
          curl -fsSL -H 'Cache-Control: no-cache' \
            "https://hanyuph.github.io/SU-Loto/beta/sync-local-first-guard.js?audit=${GITHUB_RUN_ID}" \
            | grep -F 'stopImmediatePropagation'
          echo 'LIVE_OK: correção local-first publicada.'
