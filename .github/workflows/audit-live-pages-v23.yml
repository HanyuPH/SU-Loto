name: Auditar publicação real SU Loto Beta v23

on:
  pull_request:
    branches: [beta]
    paths:
      - "docs/TRIGGER-PAGES-DEPLOY-v23.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: auditoria-publicacao-su-loto-v23
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LOTO_BASE: https://hanyuph.github.io/SU-Loto
      MEGA_BASE: https://hanyuph.github.io/SU-Mega
    steps:
      - name: Disparar workflow oficial do Pages na branch beta
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-audit
          endpoint="/repos/$GITHUB_REPOSITORY/actions/workflows/pages-main-beta.yml/runs?branch=beta&event=workflow_dispatch&per_page=20"
          before_ids=$(gh api "$endpoint" --jq '.workflow_runs[].id' 2>/dev/null || true)

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/pages-main-beta.yml/dispatches" \
            -f ref=beta

          run_id=""
          for attempt in $(seq 1 30); do
            current_ids=$(gh api "$endpoint" --jq '.workflow_runs[].id' 2>/dev/null || true)
            for candidate in $current_ids; do
              if ! grep -qx "$candidate" <<<"$before_ids"; then
                run_id="$candidate"
                break
              fi
            done
            test -n "$run_id" && break
            sleep 2
          done

          if test -z "$run_id"; then
            echo 'Não foi possível localizar o workflow_dispatch recém-criado.' >&2
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'conclusion=not-found' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Workflow Pages localizado: $run_id"

          conclusion=""
          for attempt in $(seq 1 90); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/live-audit/pages-run.json
            status=$(jq -r '.status' /tmp/live-audit/pages-run.json)
            conclusion=$(jq -r '.conclusion // ""' /tmp/live-audit/pages-run.json)
            echo "Pages run $run_id: status=$status conclusion=$conclusion"
            if test "$status" = "completed"; then break; fi
            sleep 4
          done

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/live-audit/pages-jobs.json || true
          head_sha=$(jq -r '.head_sha // ""' /tmp/live-audit/pages-run.json)
          html_url=$(jq -r '.html_url // ""' /tmp/live-audit/pages-run.json)
          printf '%s\n' "$head_sha" > /tmp/live-audit/PUBLISHED-SOURCE-COMMIT.txt
          printf '%s\n' "$run_id" > /tmp/live-audit/PAGES-WORKFLOW-RUN.txt
          printf '%s\n' "$html_url" > /tmp/live-audit/PAGES-WORKFLOW-URL.txt
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Conferir ambiente publicado com cache-busting
        id: live
        if: steps.pages.outputs.conclusion == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          audit="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_until() {
            local label="$1"
            local url="$2"
            local pattern="$3"
            local output="$4"
            local attempt
            for attempt in $(seq 1 48); do
              code=$(curl --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                --write-out '%{http_code}' --output "$output" \
                "${url}?audit=${audit}-${attempt}" || true)
              if test "$code" = "200" && grep -Fq "$pattern" "$output"; then
                printf '%s\tHTTP %s\t%s\t%s\n' "$label" "$code" "$pattern" "$url" | tee -a /tmp/live-audit/resultados.txt
                sha256sum "$output" | tee -a /tmp/live-audit/hashes.txt
                return 0
              fi
              sleep 5
            done
            echo "FALHA: $label — $url não apresentou '$pattern'." >&2
            if test -f "$output"; then head -c 1500 "$output" >&2 || true; fi
            return 1
          }

          fetch_until 'SU Loto Beta banner' "$LOTO_BASE/beta/beta-banner.js" 'const BUILD = "v23"' /tmp/live-audit/loto-beta-banner.js
          fetch_until 'SU Loto Beta VERSION' "$LOTO_BASE/beta/VERSION" 'latestBetaDocumented=v23' /tmp/live-audit/loto-beta-VERSION
          fetch_until 'SU Loto Beta bootstrap' "$LOTO_BASE/beta/bootstrap.js" 'beta-banner.js?v=23' /tmp/live-audit/loto-beta-bootstrap.js
          fetch_until 'SU Loto Beta Service Worker' "$LOTO_BASE/beta/service-worker.js" 'su-loto-c2-v23-sync-v2' /tmp/live-audit/loto-beta-service-worker.js
          fetch_until 'SU Loto Beta index' "$LOTO_BASE/beta/index.html" 'src="bootstrap.js"' /tmp/live-audit/loto-beta-index.html
          fetch_until 'SU Loto estável v11' "$LOTO_BASE/service-worker.js" 'stable-su-loto-c2-v11' /tmp/live-audit/loto-stable-service-worker.js

          fetch_until 'SU Mega Beta banner' "$MEGA_BASE/beta/beta-banner.js" 'const BUILD = "v29"' /tmp/live-audit/mega-beta-banner.js
          fetch_until 'SU Mega Beta Service Worker' "$MEGA_BASE/beta/service-worker.js" 'su-mega-c2-beta-v29' /tmp/live-audit/mega-beta-service-worker.js

          printf 'SU Loto: Beta v23 confirmada\nSU Mega: Beta v29 confirmada\n' | tee /tmp/live-audit/RESUMO.txt

      - name: Preservar evidência da auditoria pública
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-publicacao-su-loto-v23-su-mega-v29
          path: /tmp/live-audit
          if-no-files-found: error

      - name: Concluir auditoria
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.pages.outputs.conclusion }}" = "success"
          test "${{ steps.live.outcome }}" = "success"
          test -f /tmp/live-audit/RESUMO.txt
