name: Validar destaque do concurso selecionado SU Loto v23

on:
  push:
    branches:
      - agent/su-loto-v23-contest-selection-fix

permissions:
  contents: read

concurrency:
  group: qa-v23-contest-selection-fix
  cancel-in-progress: true

jobs:
  selection-highlight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar correção Beta v23
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar escopo e Carteira C2
        run: |
          node scripts/validate-wallet-data.mjs
          git fetch origin beta
          changed="$(git diff --name-only origin/beta...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^data/carteira-c2/|^data/migrations/|^VERSION$'; then
            echo 'Falha: a correção visual não pode alterar a Carteira C2, migrações ou VERSION.' >&2
            exit 1
          fi

      - name: Validar integração do destaque visual
        run: |
          node --check bootstrap.js
          node --check contest-selection-highlight.js
          node --check service-worker.js
          node --check tests/contest-selection-highlight-smoke.mjs
          grep -q 'contest-selection-highlight.js?v=1' bootstrap.js
          grep -q '"./contest-selection-highlight.js"' service-worker.js
          grep -q 'su-loto-c2-v23-sync-v2' service-worker.js
          grep -q '#7b2b91' contest-selection-highlight.js
          grep -q 'is-selected' contest-selection-highlight.js
          grep -q 'aria-current' contest-selection-highlight.js

      - name: Instalar Chromium de QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Iniciar Beta localmente
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/su-loto-selection-server.log 2>&1 &
          echo $! > /tmp/su-loto-selection-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/su-loto-selection-server.log
          exit 1

      - name: Testar seleção visual em Chromium
        env:
          QA_BASE_URL: http://127.0.0.1:4173/
        run: timeout 90s node tests/contest-selection-highlight-smoke.mjs

      - name: Encerrar servidor
        if: always()
        run: |
          if [ -f /tmp/su-loto-selection-server.pid ]; then
            kill "$(cat /tmp/su-loto-selection-server.pid)" 2>/dev/null || true
          fi
