name: Validar separação central SU Loto v23

on:
  push:
    branches:
      - agent/su-loto-v23-core-separation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qa-v23-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar Carteira C2 derivada
        run: node scripts/validate-wallet-data.mjs

      - name: Verificar registro SHA-256 da planilha oficial
        run: |
          EXPECTED="4e74e633bc8782aa9c3849f889d256baf698bb42f4cbb2b91b6519d532628764"
          VERSION_HASH="$(grep '^walletSpreadsheetSha256=' VERSION | cut -d= -f2-)"
          MANIFEST_HASH="$(node -e "const m=require('./data/carteira-c2/manifest.json');process.stdout.write(m.source.spreadsheetSha256)")"
          test "$VERSION_HASH" = "$EXPECTED"
          test "$MANIFEST_HASH" = "$EXPECTED"

      - name: Comparar dados derivados com a main estável
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const path = require('node:path');

          const legacy = [];
          for (let part = 1; part <= 6; part += 1) {
            const source = execFileSync('git', ['show', `origin/main:data/games-${part}.js`], { encoding: 'utf8' });
            const match = source.match(/\.concat\((\[.*\])\);\s*$/s);
            if (!match) throw new Error(`Não foi possível interpretar data/games-${part}.js da main.`);
            legacy.push(...JSON.parse(match[1]).map(({ initialStatus, ...game }) => game));
          }

          const manifest = JSON.parse(readFileSync('data/carteira-c2/manifest.json', 'utf8'));
          const derived = manifest.shards.flatMap(shard => {
            const payload = JSON.parse(readFileSync(path.join('data', 'carteira-c2', shard.file), 'utf8'));
            return payload.games || [];
          });

          if (JSON.stringify(derived) !== JSON.stringify(legacy)) {
            throw new Error('Os dados derivados não são idênticos à definição estável da Carteira C2 na main.');
          }
          console.log('Dados derivados idênticos à definição estável da main, sem o estado operacional legado.');
          NODE

      - name: Validar sintaxe JavaScript
        run: |
          for file in bootstrap.js app.js contests.js official-results.js service-worker.js cloud-sync.js ecosystem-ui.js ecosystem-backup.js prize-analysis.js contest-bets.js contest-bets-cloud.js contest-lock.js contest-session.js beta-layout-review.js tests/core-separation-smoke.mjs; do
            node --check "$file"
          done

      - name: Auditar separação arquitetural
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          html = Path('index.html').read_text(encoding='utf-8')
          if html.count('<script') != 1:
              raise SystemExit('index.html deve possuir somente um ponto de entrada JavaScript')
          if '<script type="module" src="bootstrap.js"></script>' not in html:
              raise SystemExit('bootstrap.js não é o ponto de entrada único do shell')
          for legacy in [f'data/games-{n}.js' for n in range(1, 7)]:
              if Path(legacy).exists():
                  raise SystemExit(f'Fonte legada ainda presente: {legacy}')

          sw = Path('service-worker.js').read_text(encoding='utf-8')
          forbidden_sw = ['officialWithCloud', 'const loader =', 'response.text()) + loader']
          for token in forbidden_sw:
              if token in sw:
                  raise SystemExit(f'Service Worker ainda contém injeção de módulo: {token}')
          if './bootstrap.js' not in sw:
              raise SystemExit('Service Worker não pré-carrega o bootstrap explícito')

          manifest = json.loads(Path('data/carteira-c2/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('operationalState') != 'not-part-of-wallet':
              raise SystemExit('Manifesto não separa estado operacional da carteira')
          forbidden_fields = {'status', 'initialStatus', 'registered', 'apostado', 'pendente'}
          total = 0
          for shard in manifest['shards']:
              payload = json.loads(Path('data/carteira-c2', shard['file']).read_text(encoding='utf-8'))
              for game in payload.get('games', []):
                  total += 1
                  overlap = forbidden_fields.intersection(game)
                  if overlap:
                      raise SystemExit(f'Jogo {game.get("id")} contém campos operacionais: {sorted(overlap)}')
          if total != 300:
              raise SystemExit(f'Quantidade derivada inesperada: {total}')

          migration = json.loads(Path('data/migrations/v11-operational-seed.json').read_text(encoding='utf-8'))
          if migration.get('type') != 'operational-migration':
              raise SystemExit('Migração operacional inválida')

          print('Arquitetura v23 validada: carteira, shell e Service Worker separados.')
          PY

      - name: Instalar navegador do smoke test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Iniciar aplicativo local
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/su-loto-v23-server.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/su-loto-v23-server.log
          exit 1

      - name: Testar aplicação e PWA offline
        env:
          QA_BASE_URL: http://127.0.0.1:4173/
        run: node tests/core-separation-smoke.mjs
