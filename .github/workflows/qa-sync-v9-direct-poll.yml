name: QA temporário sync-v9 direct-poll Safari-PWA

on:
  push:
    branches: [agent/sync-v9-hotfix3-direct-status-poll]
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validar sintaxe, C2 e gates estáticos
        run: |
          set -euo pipefail
          node --check ios-rest-operational-sync.js
          node --check beta-banner.js
          node tests/sync-v9-static.mjs
          node scripts/validate-wallet-data.mjs
      - name: Instalar Playwright Chromium e WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit
      - name: Testar sync-v9 direct-poll em Chromium e WebKit
        run: node tests/sync-v9-browser.mjs
      - name: Escopo protegido
        run: |
          set -euo pipefail
          git fetch origin beta
          changed="$(git diff --name-only origin/beta...HEAD)"
          echo "$changed"
          ! echo "$changed" | grep -E '^data/carteira-c2/'
          ! echo "$changed" | grep -E '^VERSION$|^app\.js$|^contests\.js$|^official-results\.js$'
